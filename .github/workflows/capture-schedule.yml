name: Capture ADP schedule and upload to Google Drive

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - mec_schedule_posted
  schedule:
    # GitHub schedules use UTC
    - cron: "17 12 * * *" # 5:17 AM PDT / 4:17 AM PST
    - cron: "17 2 * * *" # 7:17 PM PDT / 6:17 PM PST

permissions:
  contents: read

concurrency:
  group: adp-schedule-capture
  cancel-in-progress: false

jobs:
  capture-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log email dispatch trigger
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Repository dispatch event: ${{ github.event.action }}"
          echo "MEC mailbox: ${{ github.event.client_payload.mailbox }}"
          echo "Schedule email subject: ${{ github.event.client_payload.subject }}"
          echo "Source: ${{ github.event.client_payload.source }}"


      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb for headed Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Write Gmail OAuth files from secrets
        env:
          GOOGLE_CREDENTIALS_JSON_B64: ${{ secrets.GOOGLE_CREDENTIALS_JSON_B64 }}
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
        run: |
          mkdir -p .secrets
          if [ -n "$GOOGLE_CREDENTIALS_JSON_B64" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON_B64" | base64 --decode > .secrets/gmail_credentials.json
          fi
          if [ -n "$GOOGLE_TOKEN_JSON_B64" ]; then
            echo "$GOOGLE_TOKEN_JSON_B64" | base64 --decode > .secrets/gmail_token.json
          fi
          chmod 600 .secrets/gmail_*.json 2>/dev/null || true

      - name: Validate Gmail OAuth token
        env:
          GOOGLE_CREDENTIALS_JSON_B64: ${{ secrets.GOOGLE_CREDENTIALS_JSON_B64 }}
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
          GOOGLE_CREDENTIALS_PATH: .secrets/gmail_credentials.json
          GOOGLE_TOKEN_PATH: .secrets/gmail_token.json
          GOOGLE_REQUIRE_REFRESH_TOKEN: "true"
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON_B64" ] || [ -z "$GOOGLE_TOKEN_JSON_B64" ]; then
            echo "Skipping Gmail OAuth validation because one or both Gmail OAuth secrets are missing."
            exit 0
          fi
          npm run gmail:check

      - name: Check ADP credential inputs
        env:
          ADP_USERNAME: ${{ secrets.ADP_USERNAME }}
          ADP_PASSWORD: ${{ secrets.ADP_PASSWORD }}
          ADP_USERNAME_B64: ${{ secrets.ADP_USERNAME_B64 }}
          ADP_PASSWORD_B64: ${{ secrets.ADP_PASSWORD_B64 }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os

          def decode_optional_b64(name):
              raw = os.environ.get(name, '')
              if not raw:
                  return ''
              return base64.b64decode(''.join(raw.split()), validate=True).decode('utf-8')

          username = decode_optional_b64('ADP_USERNAME_B64') or os.environ.get('ADP_USERNAME', '')
          password = decode_optional_b64('ADP_PASSWORD_B64') or os.environ.get('ADP_PASSWORD', '')

          print('ADP_USERNAME available:', bool(username))
          print('ADP_PASSWORD available:', bool(password))
          print('ADP_USERNAME source:', 'ADP_USERNAME_B64' if os.environ.get('ADP_USERNAME_B64') else 'ADP_USERNAME')
          print('ADP_PASSWORD source:', 'ADP_PASSWORD_B64' if os.environ.get('ADP_PASSWORD_B64') else 'ADP_PASSWORD')
          print('ADP_USERNAME length:', len(username))
          print('ADP_PASSWORD length:', len(password))
          print('ADP_USERNAME sha256 prefix:', hashlib.sha256(username.encode('utf-8')).hexdigest()[:16] if username else '')
          print('ADP_PASSWORD sha256 prefix:', hashlib.sha256(password.encode('utf-8')).hexdigest()[:16] if password else '')
          PY

      - name: Capture schedule weeks
        env:
          # Prefer the *_B64 secrets when present. The JS script decodes them
          # directly from process.env, so special characters never pass through
          # shell echo/heredoc dotenv generation.
          ADP_USERNAME_B64: ${{ secrets.ADP_USERNAME_B64 }}
          ADP_PASSWORD_B64: ${{ secrets.ADP_PASSWORD_B64 }}
          ADP_USERNAME: ${{ secrets.ADP_USERNAME }}
          ADP_PASSWORD: ${{ secrets.ADP_PASSWORD }}
          ADP_URL: https://my.adp.com/#/time
          ADP_WORK_FEATURES_URL: https://my.adp.com/#/time/myworkfeatures
          # Keep this matching the local successful run. A headed browser
          # needs xvfb-run on GitHub Actions because there is no real display.
          ADP_HEADLESS: "false"
          ADP_NONINTERACTIVE: "true"
          ADP_INCOGNITO: "true"
          TZ: America/Vancouver
          ADP_TIMEZONE_ID: America/Vancouver
          ADP_LOCALE: en-CA
          ADP_WINDOW_WIDTH: "1600"
          ADP_WINDOW_HEIGHT: "1000"
          ADP_SELECT_ALL_JOBS: "true"
          ADP_FILTER_DELAY_MS: "700"
          ADP_WEEKS_TO_CAPTURE: "1"
          ADP_SKIP_PARSE: "true"
          ADP_WEEK_CAPTURE_ATTEMPTS: "3"
          ADP_RETRY_SLEEP_SECONDS: "45"
          ADP_CAPTURE_ATTEMPT_TIMEOUT_SECONDS: "7200"
          # first pass collects the full employee list; second pass enriches each shift with the grey popup breakdown
          ADP_CAPTURE_SHIFT_DETAILS: "true"
          ADP_REQUIRE_FULL_EMPLOYEE_CAPTURE: "true"
          ADP_MIN_EXPECTED_EMPLOYEES: "20"
          ADP_REQUIRE_FULL_SHIFT_BREAKDOWNS: "true"
          ADP_SCROLL_DELAY_MS: "1500"
          ADP_SHIFT_DETAIL_DELAY_MS: "900"
          ADP_SHIFT_DETAIL_CLICK_DELAY_MS: "150"
          ADP_SHIFT_DETAIL_CAPTURE_TIMEOUT_MS: "3600000"
          ADP_SHIFT_DETAIL_ROW_RETRIES: "5"
          ADP_SHIFT_DETAIL_FIND_ROW_MAX_PASSES: "240"
          ADP_NEXT_WEEK_DELAY_MS: "1500"
          ADP_NEXT_WEEK_TIMEOUT_MS: "45000"
          ADP_POST_LOGIN_TIMEOUT_MS: "120000"
          ADP_DEBUG: "true"
          ADP_TRACE: "false"
          GOOGLE_CREDENTIALS_JSON_B64: ${{ secrets.GOOGLE_CREDENTIALS_JSON_B64 }}
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
          GOOGLE_CREDENTIALS_PATH: .secrets/gmail_credentials.json
          GOOGLE_TOKEN_PATH: .secrets/gmail_token.json
          GOOGLE_REQUIRE_REFRESH_TOKEN: "true"
          CALENDAR_TIMEZONE: America/Vancouver
          CALENDAR_ALARMS: 1440,180,60
          CALENDAR_REFRESH_MINUTES: "60"
        run: |
          set -euo pipefail

          max_attempts="${ADP_WEEK_CAPTURE_ATTEMPTS:-3}"
          retry_sleep_seconds="${ADP_RETRY_SLEEP_SECONDS:-45}"
          attempt_timeout_seconds="${ADP_CAPTURE_ATTEMPT_TIMEOUT_SECONDS:-7200}"

          cleanup_adp_browser_runtime() {
            label="${1:-cleanup}"
            echo "Cleaning up ADP browser runtime after ${label}."
            pkill -TERM -f 'chrome|chromium|ms-playwright|playwright' 2>/dev/null || true
            sleep 5
            pkill -KILL -f 'chrome|chromium|ms-playwright|playwright' 2>/dev/null || true
            rm -rf "${RUNNER_TEMP:-/tmp}"/adp-capture-week-* 2>/dev/null || true
          }

          for ADP_START_WEEK_OFFSET in 0 1 2 3; do
            export ADP_START_WEEK_OFFSET
            export OUTPUT_DIR="captures/week_${ADP_START_WEEK_OFFSET}"
            export PARSED_OUT_DIR="parsed_schedule_week_${ADP_START_WEEK_OFFSET}"

            attempt=1
            last_status=0
            captured_week=0

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "::group::Capture ADP week offset ${ADP_START_WEEK_OFFSET} attempt ${attempt}/${max_attempts}"
              cleanup_adp_browser_runtime "starting week ${ADP_START_WEEK_OFFSET} attempt ${attempt}"
              rm -rf "$OUTPUT_DIR" "$PARSED_OUT_DIR"

              attempt_runtime_dir="${RUNNER_TEMP:-/tmp}/adp-capture-week-${ADP_START_WEEK_OFFSET}-attempt-${attempt}"
              rm -rf "$attempt_runtime_dir"
              mkdir -p "$attempt_runtime_dir/tmp" "$attempt_runtime_dir/profile"

              set +e
              (
                export TMPDIR="$attempt_runtime_dir/tmp"
                export ADP_PROFILE_DIR="$attempt_runtime_dir/profile"
                export ADP_ATTEMPT_RUNTIME_DIR="$attempt_runtime_dir"

                if [ "${ADP_HEADLESS}" = "false" ]; then
                  echo "Running headed Chromium under a fresh xvfb-run session for week offset ${ADP_START_WEEK_OFFSET}."
                  timeout --foreground --kill-after=30s "$attempt_timeout_seconds" \
                    xvfb-run -a --server-args="-screen 0 ${ADP_WINDOW_WIDTH:-1600}x${ADP_WINDOW_HEIGHT:-1000}x24" \
                    node adp_schedule_auto.js
                else
                  echo "Running headless Chromium in a fresh process for week offset ${ADP_START_WEEK_OFFSET}."
                  timeout --foreground --kill-after=30s "$attempt_timeout_seconds" node adp_schedule_auto.js
                fi
              )
              last_status=$?
              set -e
              cleanup_adp_browser_runtime "week ${ADP_START_WEEK_OFFSET} attempt ${attempt}"
              echo "::endgroup::"

              if [ "$last_status" -eq 0 ]; then
                captured_week=1
                echo "Week offset ${ADP_START_WEEK_OFFSET} succeeded on attempt ${attempt}/${max_attempts}."
                break
              fi

              echo "Week offset ${ADP_START_WEEK_OFFSET} failed on attempt ${attempt}/${max_attempts} with status ${last_status}." >&2

              if [ -d "$OUTPUT_DIR" ]; then
                failed_output_dir="captures/retry_failures/week_${ADP_START_WEEK_OFFSET}_attempt_${attempt}"
                rm -rf "$failed_output_dir"
                mkdir -p "$(dirname "$failed_output_dir")"
                mv "$OUTPUT_DIR" "$failed_output_dir" || true
                echo "Saved failed attempt artifacts to ${failed_output_dir}." >&2
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Sleeping ${retry_sleep_seconds}s before retrying week offset ${ADP_START_WEEK_OFFSET}." >&2
                sleep "$retry_sleep_seconds"
              fi

              attempt=$((attempt + 1))
            done

            if [ "$captured_week" -ne 1 ]; then
              echo "Week offset ${ADP_START_WEEK_OFFSET} failed after ${max_attempts} attempts." >&2
              exit "$last_status"
            fi
          done

      - name: Parse merged schedule outputs
        env:
          CALENDAR_TIMEZONE: America/Vancouver
          CALENDAR_ALARMS: 1440,180,60
          CALENDAR_REFRESH_MINUTES: "60"
        run: |
          set -euo pipefail
          mapfile -t html_files < <(find captures -path "captures/retry_failures" -prune -o -path "*/schedule_*.html" -type f -print | sort)
          printf 'Captured HTML files for final parse:\n'
          printf '  %s\n' "${html_files[@]}"
          if [ "${#html_files[@]}" -ne 4 ]; then
            echo "Expected exactly 4 captured week HTML files, got ${#html_files[@]}" >&2
            exit 1
          fi
          python3 team_schedule_parser.py "${html_files[@]}" \
            --out-dir parsed_schedule \
            --timezone "$CALENDAR_TIMEZONE" \
            --calendar-location "" \
            --alarms "$CALENDAR_ALARMS" \
            --refresh-minutes "$CALENDAR_REFRESH_MINUTES"

      - name: Check full clean shift coverage
        run: |
          set -euo pipefail
          find captures -name "*.metadata.json" -print -exec grep -n "captured_shift_detail_count" {} \;
          find captures -name "*.metadata.json" -print -exec grep -n "shift_detail_miss_count" {} \;
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("parsed_schedule/parse_summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))

          total = int(summary.get("total_shift_count") or 0)
          with_detail = int(summary.get("shifts_with_detail_count") or 0)
          missing = int(summary.get("shifts_missing_detail_count") or 0)
          with_clean_segments = int(summary.get("shifts_with_clean_segments_count") or 0)

          print("total shifts:", total)
          print("shifts with detail:", with_detail)
          print("shifts missing detail:", missing)
          print("shifts with clean segments:", with_clean_segments)

          if total <= 0:
              raise SystemExit("no shifts were parsed")
          if missing != 0 or with_detail != total:
              raise SystemExit(
                  f"shift breakdown coverage incomplete: {with_detail}/{total} with detail, {missing} missing"
              )

          calendar_dir = Path("parsed_schedule/calendars")
          calendar_files = sorted(calendar_dir.glob("*.ics"))
          if not calendar_files:
              raise SystemExit("no calendar files were generated")
          if (calendar_dir / "my-schedule.ics").exists():
              raise SystemExit("pinned My Schedule row leaked into public calendars")

          clean_description_matches = []
          raw_breakdown_matches = []
          for path in calendar_files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "DESCRIPTION:Schedule:" in text:
                  clean_description_matches.append(str(path))
              if "Shift breakdown" in text:
                  raw_breakdown_matches.append(str(path))

          print("calendar files with clean Schedule descriptions:", len(clean_description_matches))
          for item in clean_description_matches[:20]:
              print(item)

          if not clean_description_matches:
              raise SystemExit("no calendar descriptions contained cleaned Schedule text")
          if raw_breakdown_matches:
              print("raw Shift breakdown text remains in these files:")
              for item in raw_breakdown_matches[:20]:
                  print(item)
              raise SystemExit("calendar descriptions still contain raw Shift breakdown text")
          PY

      - name: Upload parsed schedule outputs to Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Recommended for normal personal My Drive folders. These make uploads
          # owned by your Google account instead of a service account with no quota.
          GOOGLE_DRIVE_CREDENTIALS_JSON_B64: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON_B64 }}
          GOOGLE_DRIVE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON_B64 }}
          # Fallback only for real Google Shared Drives, not normal shared My Drive folders.
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          max_attempts="${DRIVE_UPLOAD_ATTEMPTS:-3}"
          retry_sleep_seconds="${DRIVE_UPLOAD_RETRY_SLEEP_SECONDS:-45}"
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Google Drive upload attempt ${attempt}/${max_attempts}."
            set +e
            python3 scripts/upload_to_drive.py \
              --source-dir parsed_schedule \
              --folder-id "$GOOGLE_DRIVE_FOLDER_ID"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            echo "Google Drive upload failed on attempt ${attempt}/${max_attempts} with status ${status}." >&2
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Sleeping ${retry_sleep_seconds}s before retrying Google Drive upload." >&2
              sleep "$retry_sleep_seconds"
            fi
            attempt=$((attempt + 1))
          done

          exit "$status"

      - name: Build subscribable calendar website files
        env:
          CALENDAR_BASE_URL: https://ritchiek.tech/adp-calendars
        run: |
          python3 scripts/build_calendar_site.py \
            --source-dir parsed_schedule \
            --out-dir calendar_site \
            --base-url "$CALENDAR_BASE_URL"

      - name: Check out website repository
        uses: actions/checkout@v7
        with:
          repository: SuperRitchie/SuperRitchie.github.io
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Publish subscribable calendars to ritchiek.tech
        env:
          CALENDAR_WEBSITE_SUBDIR: adp-calendars
        run: |
          set -euo pipefail
          rm -rf "website/$CALENDAR_WEBSITE_SUBDIR"
          mkdir -p "website/$CALENDAR_WEBSITE_SUBDIR"
          cp -R calendar_site/. "website/$CALENDAR_WEBSITE_SUBDIR/"

          git -C website config user.name "github-actions[bot]"
          git -C website config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C website add "$CALENDAR_WEBSITE_SUBDIR"

          if git -C website diff --cached --quiet; then
            echo "No website calendar changes to publish."
          else
            git -C website commit -m "Update ADP schedule calendars"
            git -C website push
          fi

      - name: Upload debug artifacts if the run fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adp-debug-artifacts
          path: |
            captures/**/*.debug.json
            captures/**/*.metadata.json
            captures/**/*.png
            captures/**/*.html
            captures/**/*.visible_text.txt
            captures/**/latest_visible_text.txt
            captures/**/trace_*.zip
            parsed_schedule/parse_summary.json
          if-no-files-found: ignore
          retention-days: 3
